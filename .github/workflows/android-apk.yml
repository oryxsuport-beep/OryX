
name: Gerar APK OryX

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Extrair e localizar projeto
        run: |
          unzip -o OryX-Android-Source.zip -d app
          PACKAGE=$(find app -name package.json -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "package.json não encontrado no ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Instalar dependências
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar aplicativo
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OryX-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
