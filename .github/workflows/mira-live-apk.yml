name: Mira Live Android APK (experimental)
on:
  push:
    branches: ['feat/mira-live-8ball']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Mira Live
        run: |
          mkdir -p mira
          base64 -d miralive_src.tar.xz.b64 > miralive_src.tar.xz
          tar -xJf miralive_src.tar.xz -C mira
      - name: Build debug APK
        run: gradle --no-daemon --project-dir mira assembleDebug
      - name: Publish downloadable APK on separate branch
        run: |
          mkdir -p builds
          cp mira/app/build/outputs/apk/debug/app-debug.apk builds/MiraLivePRO-v0.6-beta.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/MiraLivePRO-v0.6-beta.apk
          git diff --cached --quiet || git commit -m "Build Mira Live PRO v0.6 beta"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraLivePRO-v0.6-beta
          path: mira/app/build/outputs/apk/debug/app-debug.apk
