name: Mira Live Android APK (experimental)
on:
  push:
    branches: ['feat/mira-live-8ball']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: |
          mkdir -p mira
          base64 -d miralive_src.tar.xz.b64 > miralive_src.tar.xz
          tar -xJf miralive_src.tar.xz -C mira
      - name: Compilar
        run: gradle --no-daemon --project-dir mira assembleDebug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiraLive8Ball-debug-apk
          path: mira/app/build/outputs/apk/debug/app-debug.apk
